name: Build ADB Tool

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            executable: ADB_Tool.exe
            artifact: windows
          - os: macos-latest
            executable: ADB Tool.app
            artifact: macos
          - os: ubuntu-latest
            executable: ADB_Tool
            artifact: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 -r requirements.txt

      - name: Build executable (Windows & Linux)
        if: matrix.os != 'macos-latest'
        run: |
          pyinstaller --name "ADB_Tool" --windowed --onefile --clean adb_gui.py

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --name "ADB Tool" --windowed --onedir --clean --noconfirm adb_gui.py

      # macOS signing and notarization
      - name: Import Apple code signing certificate
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: apple-actions/import-codesign-certificates@v1
        with:
          keychain: temporary.keychain
          p12-file: ${{ secrets.APPLE_P12_FILE }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Sign executable (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Create entitlements file
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key>
              <false/>
          </dict>
          </plist>
          EOF
          # Codesign the app
          codesign --sign "${{ secrets.DEVELOPER_ID }}" \
            --force \
            --timestamp \
            --options=runtime \
            --entitlements entitlements.plist \
            "dist/ADB Tool.app"

      - name: Notarize app (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Store Apple ID credentials
          xcrun notarytool store-credentials --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.TEAM_ID }}"
          # Submit for notarization
          xcrun notarytool submit "dist/ADB Tool.app" --wait
          # Staple the ticket
          xcrun stapler staple "dist/ADB Tool.app"

      - name: Create signed DMG (macOS)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Create DMG
          hdiutil create -format UDZO -srcfolder "dist/ADB Tool.app" -volname "ADB Tool" "dist/ADB Tool_macOS.dmg"
          # Sign the DMG
          codesign --sign "${{ secrets.DEVELOPER_ID }}" --timestamp "dist/ADB Tool_macOS.dmg"

      - name: Upload artifact (Windows & Linux)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.executable }}

      - name: Upload artifact (macOS)
        if: matrix.os != 'macos-latest' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Upload signed macOS artifacts
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create ZIP archives
        run: |
          cd artifacts
          zip -r ADB_Tool_Windows.zip windows/
          zip -r ADB_Tool_Linux.zip linux/

      # Create signed macOS ZIP (preserving the notarized .app structure)
      - name: Create macOS ZIP
        run: |
          cd artifacts
          # Keep the .app bundle intact in the ZIP
          zip -r ADB_Tool_macOS.zip macos-signed/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ADB_Tool_Windows.zip
            artifacts/ADB_Tool_macOS.zip
            artifacts/ADB_Tool_Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
